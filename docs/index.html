<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طيب — مشروع تعطير مساجد الرياض</title>
<meta name="description" content="منصة طيب لإدارة مشروع تعطير مساجد الرياض">
<meta name="theme-color" content="#063a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طيب">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root {
  --brand: #0b5d4b;
  --brand-2: #0e7a62;
  --brand-ink: #063a2f;
  --gold: #c39a4b;
  --gold-soft: #f3e8d2;
  --bg: #f5f3ec;
  --surface: #ffffff;
  --surface-2: #faf8f3;
  --line: #e6e1d4;
  --ink: #1b2622;
  --ink-2: #4c5a54;
  --ink-3: #7d8a84;
  --ok: #1f8a5b;
  --ok-soft: #e2f4ea;
  --warn: #b7791f;
  --warn-soft: #fbf0db;
  --bad: #c0392b;
  --bad-soft: #fbe5e2;
  --info: #2c6e9b;
  --info-soft: #e3eff7;
  --shadow: 0 1px 2px rgba(10, 40, 30, .06), 0 4px 16px rgba(10, 40, 30, .06);
  --radius: 14px;
  --font: "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #2bb38f; --brand-2: #39c9a2; --brand-ink: #d6f5ea; --gold: #d9b56a; --gold-soft: #3a3120;
    --bg: #0e1513; --surface: #151f1c; --surface-2: #1a2622; --line: #26352f; --ink: #e8efec; --ink-2: #b3c1bb; --ink-3: #82918b;
    --ok-soft: #173a2a; --warn-soft: #3b2f17; --bad-soft: #3d1d19; --info-soft: #172d3c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #2bb38f; --brand-2: #39c9a2; --brand-ink: #d6f5ea; --gold: #d9b56a; --gold-soft: #3a3120;
  --bg: #0e1513; --surface: #151f1c; --surface-2: #1a2622; --line: #26352f; --ink: #e8efec; --ink-2: #b3c1bb; --ink-3: #82918b;
  --ok-soft: #173a2a; --warn-soft: #3b2f17; --bad-soft: #3d1d19; --info-soft: #172d3c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
body { -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.right { margin-inline-start: auto; }

/* ───── layout ───── */
#app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
#app.auth { display: block; }
#app.auth .side, #app.auth .topbar, #app.auth .bnav { display: none; }
#app.auth .view { padding: 0; max-width: none; }
.side { background: var(--brand-ink); color: #e9f3ef; padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
:root[data-theme="dark"] .side, :root:not([data-theme="light"]) .side { background: #0a1210; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .side { background: #063a2f; } }
:root[data-theme="light"] .side { background: #063a2f; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
.brand .logo { width: 44px; height: 44px; flex: none; }
.brand .logo img { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; background: #fff; }
.brand .name { font-family: var(--font-display); font-size: 26px; line-height: 1; color: #fff; }
.brand .sub { font-size: 11.5px; color: #a9c7bc; margin-top: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: #cfe2db; font-weight: 500; font-size: 14.5px; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.on { background: rgba(195,154,75,.16); color: #fff; box-shadow: inset -3px 0 0 var(--gold); }
.nav a svg { width: 19px; height: 19px; flex: none; opacity: .9; }
.nav .badge { margin-inline-start: auto; background: var(--gold); color: #1d1606; border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.nav .sec { font-size: 11px; letter-spacing: .02em; color: #7fa597; padding: 12px 12px 4px; }
.side .me { margin-top: auto; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 13px; }
.side .me b { display: block; color: #fff; font-weight: 600; }
.side .me .role { color: var(--gold); font-size: 12px; }
.side .me button { margin-top: 8px; background: none; border: 1px solid rgba(255,255,255,.18); color: #dfeee8; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 19px; margin: 0; font-weight: 700; }
.topbar .crumbs { color: var(--ink-3); font-size: 13px; }
.view { padding: 22px 24px 90px; max-width: 1400px; width: 100%; }
.iconbtn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.iconbtn:hover { color: var(--brand); border-color: var(--brand); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .dot { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.iconbtn.ring svg { animation: ring 1s ease; }
@keyframes ring { 0%,100% { transform: rotate(0); } 15% { transform: rotate(16deg); } 30% { transform: rotate(-14deg); } 45% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } }
.menu-btn { display: none; }
.bnav { display: none; }

/* ───── components ───── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card > .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card > .hd h3 { margin: 0; font-size: 15.5px; font-weight: 700; }
.card > .bd { padding: 16px 18px; }
.card.pad { padding: 18px; }
.grid { display: grid; gap: 16px; }
.grid > *, .kpis > * { min-width: 0; }
.card > .bd:has(> canvas) { position: relative; }
canvas { max-width: 100%; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #062a21; }
.btn.primary:hover { background: var(--brand-2); color: #fff; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1e1606; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.contact { display: inline-flex; gap: 4px; vertical-align: middle; }
.contact a { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.contact a svg { width: 15px; height: 15px; }
.contact a.wa { color: #1fa855; }
.contact a.wa:hover { background: #1fa855; color: #fff; border-color: #1fa855; }
.contact a.tel:hover { background: var(--info); color: #fff; border-color: var(--info); }
.contact a.mail:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
.chip.plain::before { display: none; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.gold { background: var(--gold-soft); color: #8a6a2a; border-color: transparent; }
:root[data-theme="dark"] .chip.gold { color: var(--gold); }

.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field label .req { color: var(--bad); }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); outline: none; }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
textarea.input { min-height: 88px; resize: vertical; }
.form { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.search { position: relative; }
.search input { padding-inline-start: 36px; }
.search svg { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); width: 17px; color: var(--ink-3); }

.rating { display: inline-flex; gap: 4px; direction: ltr; }
.rating button { border: 1px solid var(--line); background: var(--surface); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-weight: 700; color: var(--ink-2); }
.rating button.on { background: var(--gold); border-color: var(--gold); color: #1e1606; }
.stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--brand); color: #fff; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: start; font-weight: 600; color: var(--ink-3); font-size: 12.5px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.tbl .t-name { font-weight: 600; }
.prow { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.3; padding: 2px 0; }
.prow .pr { color: var(--ink-3); font-size: 11.5px; width: 34px; flex: none; }
.prow .contact a { width: 24px; height: 24px; border-radius: 7px; }
.prow .contact a svg { width: 13px; height: 13px; }
.tbl-wrap { overflow: auto; max-height: 70vh; border-radius: 0 0 var(--radius) var(--radius); }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
.empty svg { width: 46px; height: 46px; color: var(--line); display: block; margin: 0 auto 10px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
.tabs button .n { background: var(--surface-2); border-radius: 99px; padding: 0 7px; font-size: 11.5px; margin-inline-start: 4px; }

/* ───── KPI ───── */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; position: relative; overflow: hidden; }
.kpi .lbl { color: var(--ink-3); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.kpi .lbl svg { width: 17px; height: 17px; color: var(--brand); }
.kpi .val { font-size: 30px; font-weight: 700; margin-top: 6px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 14px; color: var(--ink-3); font-weight: 500; }
.kpi .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.kpi.hero { background: linear-gradient(135deg, #063a2f, #0b5d4b 60%, #0e7a62); color: #fff; border: 0; }
.kpi.hero .lbl, .kpi.hero .sub { color: #cfe7de; }
.kpi.hero .lbl svg { color: var(--gold); }
.kpi.hero::after { content: ""; position: absolute; inset-inline-end: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; border: 22px solid rgba(195,154,75,.18); }
.kpi.alert .val { color: var(--bad); }
.kpi.warn .val { color: var(--warn); }
.kpi a.more { position: absolute; inset: 0; }

/* funnel / pipeline */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.pipe .st { padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; transition: .15s; }
.pipe .st:hover { border-color: var(--brand); }
.pipe .st .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pipe .st .l { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.pipe .st .who { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.pipe .st.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.pipe .st.on .l, .pipe .st.on .who { color: #d9efe7; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.bar.gold > i { background: var(--gold); }

/* workflow stepper */
.steps { display: grid; gap: 0; counter-reset: s; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.step::before { content: ""; position: absolute; inset-inline-start: 16px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .dotn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); border: 2px solid var(--line); color: var(--ink-3); z-index: 1; }
.step.done .dotn { background: var(--brand); border-color: var(--brand); color: #fff; }
.step.done::before { background: var(--brand); }
.step.now .dotn { background: var(--gold); border-color: var(--gold); color: #1e1606; box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 25%, transparent); }
.step .t { font-weight: 600; font-size: 14px; }
.step .w { font-size: 12px; color: var(--ink-3); }
.step.now .t { color: var(--ink); }
.step:not(.done):not(.now) .t { color: var(--ink-3); }

.action-card { border: 1px solid color-mix(in srgb, var(--gold) 50%, var(--line)); background: linear-gradient(180deg, var(--gold-soft), var(--surface)); border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.action-card .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--gold); color: #1e1606; display: grid; place-items: center; flex: none; }
.action-card .ic svg { width: 22px; height: 22px; }
.action-card > .grow { flex: 1 1 260px; min-width: 220px; }
.action-card h4 { margin: 0; font-size: 15.5px; }
.action-card p { margin: 2px 0 0; color: var(--ink-2); font-size: 13.5px; }

/* mosque header */
.mhead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; padding: 20px; }
.mhead .mic { width: 58px; height: 58px; border-radius: 16px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; flex: none; }
.mhead .mic svg { width: 32px; height: 32px; }
.mhead h2 { margin: 0; font-size: 22px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 20px; }
.kv .k { font-size: 12.5px; color: var(--ink-3); }
.kv .v { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.people { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.person { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
.person .r { font-size: 12px; color: var(--gold); font-weight: 700; }
.person .n { font-weight: 600; margin: 2px 0; }
.person .p { font-size: 13px; color: var(--ink-3); direction: ltr; text-align: end; }

/* timeline */
.tl { display: grid; gap: 12px; }
.tl-item { display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.tl-item .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand); border: 1px solid var(--line); }
.tl-item .ti svg { width: 19px; height: 19px; }
.tl-item .tb { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.tl-item .th { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl-item .th b { font-size: 14.5px; }
.tl-item dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px 16px; margin: 10px 0 0; }
.tl-item dt { font-size: 12px; color: var(--ink-3); }
.tl-item dd { margin: 0; font-weight: 600; font-size: 13.5px; }
.files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.file { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 13px; cursor: pointer; max-width: 260px; }
.file svg { width: 16px; height: 16px; flex: none; color: var(--bad); }
.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb { width: 92px; height: 92px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--ink-3); cursor: pointer; background: var(--surface-2); }
.drop:hover, .drop.over { border-color: var(--brand); color: var(--brand); }
.uplist { display: grid; gap: 6px; margin-top: 8px; }
.uplist .u { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.uplist .u .bar { flex: 1; }

/* notifications */
.npanel { position: fixed; top: 64px; inset-inline-end: 20px; width: 400px; max-width: calc(100vw - 32px); max-height: 75vh; display: flex; flex-direction: column; z-index: 60; }
.npanel .list { overflow: auto; }
.nitem { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
.nitem:hover { background: var(--surface-2); }
.nitem.unread { background: color-mix(in srgb, var(--gold-soft) 60%, var(--surface)); }
.nitem.unread::after { content: ""; position: absolute; inset-inline-end: 14px; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.nitem .ni { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; }
.nitem .ni svg { width: 18px; height: 18px; }
.nitem b { font-size: 14px; font-weight: 600; display: block; padding-inline-end: 14px; }

.toasts { position: fixed; bottom: 20px; inset-inline-end: 20px; display: grid; gap: 10px; z-index: 100; max-width: 380px; }
.toast { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--brand); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); animation: tin .25s ease; font-size: 14px; }
.toast.err { border-inline-start-color: var(--bad); }
.toast.notif { border-inline-start-color: var(--gold); cursor: pointer; }
.toast b { display: block; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 20, 16, .5); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade .15s; }

.modal { background: var(--surface); border-radius: 18px; width: min(720px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(1080px, 100%); }
.modal .mh { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal .mh h3 { margin: 0; font-size: 17px; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 120; display: grid; place-items: center; cursor: zoom-out; padding: 20px; }
.lightbox img { max-height: 90vh; border-radius: 10px; }

.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }

.login .art h1 { font-family: var(--font-display); font-size: 74px; margin: 0; line-height: 1; color: #fff; }
.login .art .tag { font-size: 20px; color: #e3d2a9; margin-top: 10px; }
.login .art p { max-width: 460px; color: #cfe3dc; }
.login .art .feat { display: grid; gap: 10px; position: relative; }

.login .box { width: min(400px, 100%); }
.login .box h2 { margin: 0 0 4px; font-size: 24px; }

/* print */
.print-only { display: none; }
@media print {

  body { background: #fff; color: #000; font-size: 12pt; }
  .side, .topbar, .bnav, .toasts, .no-print, .modal-bg { display: none !important; }
  #app { display: block; }
  .view { padding: 0; max-width: none; }
  .card { box-shadow: none; border-color: #ccc; break-inside: avoid; }
  .print-only { display: block; }
  body.printing-doc > *:not(#printdoc) { display: none !important; }
  #printdoc { display: block !important; }
}
#printdoc { display: none; }
.doc { font-family: var(--font); color: #111; }
.doc .dh { display: flex; align-items: center; gap: 14px; border-bottom: 3px solid #0b5d4b; padding-bottom: 12px; margin-bottom: 18px; }
.doc .dh .t { font-family: var(--font-display); font-size: 30px; color: #0b5d4b; line-height: 1; }
.doc .dh .s { color: #555; font-size: 13px; }
.doc h2 { font-size: 18px; margin: 18px 0 8px; color: #0b5d4b; }
.doc table { width: 100%; border-collapse: collapse; font-size: 12pt; }
.doc td, .doc th { border: 1px solid #ccc; padding: 6px 10px; text-align: start; }
.doc th { background: #f1ede2; width: 30%; }
.doc .foot { margin-top: 30px; font-size: 11px; color: #777; border-top: 1px solid #ddd; padding-top: 8px; }

/* ───── responsive ───── */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 860px) {

  .menu-btn { display: grid; }

  .view { padding: 16px 16px 96px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }

  .form { grid-template-columns: 1fr; }
  .people { grid-template-columns: 1fr; }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

// ───── واجهة عامة ─────
function toast(msg, type = "", opts = {}) {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = opts.title ? `<b>${esc(opts.title)}</b>${esc(msg || "")}` : esc(msg);
  if (opts.onClick) el.onclick = () => { opts.onClick(); el.remove(); };
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), opts.ms || (type === "err" ? 6500 : 4000));
}
function errMsg(e) {
  const m = e?.message || String(e);
  if (/row-level security|permission denied/i.test(m)) return "لا تملك صلاحية تنفيذ هذا الإجراء";
  if (/duplicate key/i.test(m)) return "القيمة موجودة مسبقًا";
  if (/Failed to fetch|NetworkError/i.test(m)) return "تعذّر الاتصال بالخادم — تحقق من الإنترنت";
  return m;
}
async function run(promise, okMsg) {
  try {
    const r = await promise;
    if (r && r.error) throw r.error;
    if (okMsg) toast(okMsg);
    return r ? (r.data ?? true) : true;
  } catch (e) { toast(errMsg(e), "err"); return null; }
}

function modal({ title, body, actions = [], wide = false, onOpen } = {}) {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">
      <div class="mh"><h3>${esc(title)}</h3><button class="btn ghost sm right" data-x>${I.x}</button></div>
      <div class="mb"></div><div class="mf"></div></div>`;
    const mb = $(".mb", bg), mf = $(".mf", bg);
    if (typeof body === "string") mb.innerHTML = body; else if (body) mb.appendChild(body);
    const close = (v) => { bg.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = (e) => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", onKey);
    $("[data-x]", bg).onclick = () => close(null);
    bg.addEventListener("mousedown", (e) => { if (e.target === bg) close(null); });
    actions.forEach((a) => {
      const b = document.createElement("button");
      b.className = "btn " + (a.cls || "");
      b.innerHTML = a.label;
      b.onclick = async () => {
        if (!a.onClick) return close(a.value);
        b.disabled = true;
        try { const v = await a.onClick(mb, close); if (v !== false && v !== undefined) close(v); }
        finally { b.disabled = false; }
      };
      mf.appendChild(b);
    });
    if (!actions.length) mf.remove();
    document.body.appendChild(bg);
    onOpen && onOpen(mb, close);
    setTimeout(() => $("input,select,textarea", mb)?.focus(), 30);
  });
}

// قراءة نموذج إلى كائن
function formData(root) {
  const o = {};
  $$("[name]", root).forEach((el) => {
    if (el.type === "checkbox") o[el.name] = el.checked;
    else if (el.type === "radio") { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value.trim();
  });
  $$("[data-rating]", root).forEach((el) => { o[el.dataset.rating] = el.dataset.value ? +el.dataset.value : null; });
  return o;
}
const fld = (name, label, { type = "text", value = "", req = false, opts = null, full = false, hint = "", attrs = "", ph = "" } = {}) => {
  let input;
  if (opts) input = `<select class="input" name="${name}" ${attrs}>${opts.map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`;
  else if (type === "textarea") input = `<textarea class="input" name="${name}" placeholder="${esc(ph)}" ${attrs}>${esc(value)}</textarea>`;
  else input = `<input class="input" type="${type}" name="${name}" value="${esc(value)}" placeholder="${esc(ph)}" ${type === "tel" ? 'dir="ltr" inputmode="tel"' : ""} ${type === "email" ? 'dir="ltr"' : ""} ${attrs}>`;
  return `<div class="field ${full ? "full" : ""}"><label>${esc(label)}${req ? ' <span class="req">*</span>' : ""}</label>${input}${hint ? `<div class="hint">${esc(hint)}</div>` : ""}</div>`;
};
const ratingFld = (name, label, value = null, full = false) => `<div class="field ${full ? "full" : ""}"><label>${esc(label)}</label>
  <div class="rating" data-rating="${name}" data-value="${value ?? ""}">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-n="${n}" class="${value >= n ? "on" : ""}">${n}</button>`).join("")}</div></div>`;
function bindRatings(root) {
  $$("[data-rating]", root).forEach((r) => r.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    r.dataset.value = b.dataset.n;
    $$("button", r).forEach((x) => x.classList.toggle("on", +x.dataset.n <= +b.dataset.n));
  }));
}

// ───── رفع الملفات (حتى ٥٠ ميقابايت لكل ملف) ─────
function uploader({ accept = "image/*,application/pdf", label = "اسحب الصور أو ملفات PDF هنا أو اضغط للاختيار" } = {}) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="drop">${I.upload.replace("<svg", '<svg style="width:26px;height:26px;display:block;margin:0 auto 6px"')}${esc(label)}<div class="hint">حتى ${MAX_FILE / 1048576} ميقابايت للملف الواحد</div></div>
    <input type="file" multiple accept="${accept}" hidden><div class="uplist"></div>`;
  const files = [];
  const input = $("input", wrap), drop = $(".drop", wrap), list = $(".uplist", wrap);
  const render = () => {
    list.innerHTML = files.map((f, i) => `<div class="u">${f.type.startsWith("image/") ? I.file : I.report}<span class="grow">${esc(f.name)}</span><span class="muted small num">${fmtSize(f.size)}</span>
      <button type="button" class="btn ghost sm" data-rm="${i}">${I.x}</button></div>`).join("");
  };
  const add = (fl) => {
    for (const f of fl) {
      if (f.size > MAX_FILE) { toast(`«${f.name}» أكبر من ٥٠ ميقابايت`, "err"); continue; }
      files.push(f);
    }
    render();
  };
  drop.onclick = () => input.click();
  input.onchange = () => { add(input.files); input.value = ""; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
  list.onclick = (e) => { const b = e.target.closest("[data-rm]"); if (b) { files.splice(+b.dataset.rm, 1); render(); } };
  wrap.files = files;
  wrap.progress = (i, txt) => { const row = list.children[i]; if (row) $(".num", row).textContent = txt; };
  return wrap;
}
const safeName = (n) => n.replace(/[^\w.\-؀-ۿ]+/g, "_").slice(-80);
// يرفع الملفات ثم يسجلها في جدول المرفقات
async function uploadFiles(files, { mosqueId = null, taskId = null, reportId = null, ui = null } = {}) {
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const base = mosqueId ? `m/${mosqueId}` : `t/${taskId}`;
    const path = `${base}/${uid()}-${safeName(f.name)}`;
    ui?.progress(i, "جارٍ الرفع…");
    const { error } = await sb.storage.from("files").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
    if (error) { toast(`تعذّر رفع «${f.name}»: ${errMsg(error)}`, "err"); ui?.progress(i, "فشل"); continue; }
    const { data, error: e2 } = await sb.from("attachments").insert({ mosque_id: mosqueId, task_id: taskId, report_id: reportId, path, name: f.name, size: f.size, mime: f.type }).select().single();
    if (e2) { toast(errMsg(e2), "err"); continue; }
    ui?.progress(i, "✓");
    out.push(data);
  }
  return out;
}
const urlCache = new Map();
async function fileUrl(path) {
  const c = urlCache.get(path);
  if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await sb.storage.from("files").createSignedUrl(path, 3600);
  if (error) throw error;
  urlCache.set(path, { url: data.signedUrl, exp: Date.now() + 3500e3 });
  return data.signedUrl;
}
function filesHtml(atts) {
  if (!atts?.length) return "";
  return `<div class="files">${atts.map((a) => a.mime?.startsWith("image/")
    ? `<img class="thumb" data-img="${esc(a.path)}" alt="${esc(a.name)}" title="${esc(a.name)}">`
    : `<span class="file" data-open="${esc(a.path)}" title="${esc(a.name)}">${I.file}<span>${esc(a.name)}</span><small class="muted num">${a.size ? fmtSize(a.size) : ""}</small></span>`).join("")}</div>`;
}
// يحمّل الصور المصغرة ويربط فتح الملفات
function hydrateFiles(root) {
  $$("img[data-img]", root).forEach(async (img) => {
    try { img.src = await fileUrl(img.dataset.img); img.onclick = () => lightbox(img.src); } catch { img.alt = "تعذّر التحميل"; }
  });
  $$("[data-open]", root).forEach((el) => el.onclick = async () => {
    try { window.open(await fileUrl(el.dataset.open), "_blank", "noopener"); } catch (e) { toast(errMsg(e), "err"); }
  });
}

function exportXlsx(rows, filename, sheet = "البيانات") {
  if (!window.XLSX) return toast("مكتبة Excel لم تُحمّل بعد", "err");
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = Object.keys(rows[0] || {}).map((k) => ({ wch: Math.max(12, k.length + 4) }));
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, sheet);
  XLSX.writeFile(wb, filename);
}

async function loadMosques(force = false) {
  if (S.mosques && !force) return S.mosques;
  if (role() === "viewer") return (S.mosques = []);
  const all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("mosques").select("*").order("code").range(from, from + 999);
    if (error) { toast(errMsg(error), "err"); break; }
    all.push(...data);
    if (data.length < 1000) break;
  }
  S.mosques = all;
  return all;
}

async function refreshMosque(id) {
  const { data } = await sb.from("mosques").select("*").eq("id", id).maybeSingle();
  if (!S.mosques) return data;
  const i = S.mosques.findIndex((m) => m.id === id);
  if (data) { if (i >= 0) S.mosques[i] = data; else S.mosques.push(data); }
  else if (i >= 0) S.mosques.splice(i, 1);
  return data;
}

let notifChannel = null;
async function loadNotifications() {
  const { data } = await sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(200);
  S.notifications = data || [];
  S.unread = S.notifications.filter((n) => !n.read_at).length;

function subscribeNotifications() {
  if (notifChannel || !S.me) return;
  notifChannel = sb.channel("notif-" + S.me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `account_id=eq.${S.me.id}` }, (p) => {
      const n = p.new;
      if (S.notifications.some((x) => x.id === n.id)) return;
      S.notifications.unshift(n);
      S.unread++;
      paintBell(true);
      chime(n.kind);
      toast(n.body || "", "notif", { title: n.title, ms: 7000, onClick: () => openNotification(n) });
      if (document.hidden && "Notification" in window && Notification.permission === "granted") {
        try { new Notification(n.title, { body: n.body || "", icon: S.logoUrl || undefined, tag: n.id }); } catch {}
      }
      if (n.mosque_id && S.mosques) refreshMosque(n.mosque_id);
    })
    .subscribe();
}
let audioCtx = null;
function chime(kind) {
  if (localStorage.getItem("tayyib.mute") === "1") return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "alert" ? [880, 660] : kind === "reminder" ? [660, 880, 990] : [740, 988];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = audioCtx.currentTime + i * 0.13;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}
function paintBell(ring = false) {
  const b = $("#bell");
  if (!b) return;
  const dot = $(".dot", b);
  dot.textContent = S.unread > 99 ? "99+" : S.unread;
  dot.hidden = !S.unread;
  if (ring) { b.classList.remove("ring"); void b.offsetWidth; b.classList.add("ring"); }
  const nb = $('.nav a[data-r="notifications"] .badge');
  if (nb) { nb.textContent = S.unread; nb.hidden = !S.unread; }
}
async function markRead(ids) {
  if (!ids.length) return;
  const now = new Date().toISOString();
  await sb.from("notifications").update({ read_at: now }).in("id", ids);
  S.notifications.forEach((n) => { if (ids.includes(n.id)) n.read_at = now; });
  S.unread = S.notifications.filter((n) => !n.read_at).length;
  paintBell();
}
function openNotification(n) {
  if (!n.read_at) markRead([n.id]);
  closeNotifPanel();
  if (n.task_id) go("/tasks/" + n.task_id);
  else if (n.mosque_id) go("/mosque/" + n.mosque_id);
}

function reportDetails(r) {
  const T = REPORT_TYPES[r.type] || { labels: {} };
  const d = r.data || {};
  const rows = Object.entries(T.labels || {}).filter(([k]) => d[k] !== undefined && d[k] !== "" && d[k] !== null)
    .map(([k, l]) => [l, T.show?.[k] ? T.show[k](d[k]) : (k === "date" ? fmtDate(d[k]) : d[k])]);
  return rows;
}
function reportCard(r, atts = [], authors = {}) {

    ${filesHtml(atts)}</div></div>`;
}

// نافذة رفع تقرير لمسجد — تعيد true عند النجاح
async function openReportForm(m, type, ctx = {}) {
  const T = REPORT_TYPES[type];
  if (type === "monthly" && !ctx.month) Object.assign(ctx, await monthlyContext(m, monthKey()));
  const body = document.createElement("div");
  body.innerHTML = `<div class="row" style="margin-bottom:14px">${stageChip(m.stage)}<b>${esc(m.name)}</b><span class="muted small">${esc(m.code)}</span></div>
    <form class="form" onsubmit="return false">${T.fields(m, ctx).join("")}</form>
    <div class="field" style="margin-top:14px"><label>المرفقات (صور وملفات PDF)</label><div data-up></div></div>`;
  const up = uploader();
  $("[data-up]", body).appendChild(up);
  bindRatings(body);
  if (type === "monthly") {
    $('[name="month"]', body).onchange = async (e) => {
      const c = await monthlyContext(m, e.target.value);
      $('[name="visits"]', body).value = c.visits; $('[name="satisfaction"]', body).value = c.satisfaction ?? ""; $('[name="refills"]', body).value = c.refills;
    };
  }
  return modal({
    title: T.l, body, wide: true,
    actions: [{
      label: `${I.check} رفع التقرير`, cls: "primary", onClick: async (mb) => {
        const d = formData($("form", mb));
        const missing = $$("[name]", mb).find((el) => el.closest(".field")?.querySelector(".req") && !el.value.trim());
        if (missing) { toast("أكمل الحقول المطلوبة", "err"); missing.focus(); return false; }
        const v = T.validate?.(d);
        if (v) { toast(v, "err"); return false; }
        if (type === "refill" && d.date) d.date = new Date(d.date).toISOString();
        if ((type === "installation" || type === "visit") && d.date) d.date = new Date(d.date + "T09:00:00").toISOString();
        const { data: rep, error } = await sb.rpc("submit_report", { p_mosque: m.id, p_type: type, p_data: d, p_summary: T.summary ? T.summary(d) : null });
        if (error) { toast(errMsg(error), "err"); return false; }
        if (up.files.length) await uploadFiles(up.files, { mosqueId: m.id, reportId: rep.id, ui: up });
        toast("تم رفع التقرير بنجاح");
        await refreshMosque(m.id);
        return true;
      },
    }, { label: "إلغاء" }],
  });
}
async function monthlyContext(m, ym) {
  const start = new Date(ym + "-01T00:00:00"), end = new Date(start); end.setMonth(end.getMonth() + 1);
  const { data } = await sb.from("reports").select("type,data,created_at").eq("mosque_id", m.id).gte("created_at", start.toISOString()).lt("created_at", end.toISOString());
  const rs = data || [];
  const sat = rs.filter((r) => r.type === "satisfaction" && r.data?.overall).map((r) => +r.data.overall);
  return { month: ym, visits: rs.filter((r) => r.type === "visit").length, refills: rs.filter((r) => r.type === "refill").length,
    satisfaction: sat.length ? (sat.reduce((a, b) => a + b, 0) / sat.length).toFixed(2) : null };
}

        <tbody>${(st.by_association || []).map((a) => `<tr><td class="t-name">${esc(a.name)}</td><td class="num">${a.total}</td><td class="num">${a.active}</td><td class="num">${a.pending}</td>
          <td class="num">${a.visits}</td><td>${stars(a.satisfaction)}</td><td><div class="bar"><i style="width:${a.total ? Math.round(a.active / a.total * 100) : 0}%"></i></div></td></tr>`).join("") ||
          `<tr><td colspan="7" class="empty">لا توجد جمعيات مسند لها مساجد بعد</td></tr>`}</tbody></table></div></div>` : ""}

      <div class="grid g2" style="margin-top:16px">
        ${r !== "viewer" ? `<div class="card"><div class="hd"><h3>يتطلب إجراءك</h3><span class="chip gold plain" id="todo-n"></span></div><div class="bd" id="todo"></div></div>` : ""}
        <div class="card ${r === "viewer" ? "span2" : ""}"><div class="hd"><h3>آخر المستجدات</h3></div><div class="bd"><div class="tl">${(st.recent || []).map((a) => `
          <div class="row" style="gap:10px;${r !== "viewer" ? "cursor:pointer" : ""}" ${r !== "viewer" ? `data-m="${a.mosque_id}"` : ""}><span class="chip plain">${ago(a.at)}</span><b class="small">${esc(a.mosque)}</b><span class="small muted">${esc(a.action)}</span></div>`).join("") || `<div class="empty">لا يوجد نشاط بعد</div>`}</div></div></div>

    $$("[data-stage]", v).forEach((el) => el.onclick = () => go("/mosques?stage=" + el.dataset.stage));

    if (r !== "viewer") drawTodo(v);
    drawCharts(st);
  },

});

function drawTodo(v) {
  const r = role();
  const items = [];
  for (const m of S.mosques || []) {
    const a = nextAction(m);
    if (a && !a.waiting) items.push({ m, t: a.title, c: "gold" });
    if (m.stage === "active") {
      const h = m.next_refill_at ? (new Date(m.next_refill_at) - Date.now()) / 36e5 : null;
      if ((r === "company" || r === "admin") && h != null && h <= (S.settings.reminder_hours || 72)) items.push({ m, t: h < 0 ? "تعبئة متأخرة" : `تعبئة ${untilText(m.next_refill_at)}`, c: h < 0 ? "bad" : "warn" });
      const lv = m.last_visit_at || m.installed_at;
      if ((r === "association") && lv && Date.now() - new Date(lv) > (S.settings.visit_every_days || 7) * 864e5) items.push({ m, t: "زيارة أسبوعية مستحقة", c: "warn" });
    }
  }
  $("#todo-n", v).textContent = items.length;
  $("#todo", v).innerHTML = items.length ? `<div class="tl">${items.slice(0, 12).map((x) => `<div class="row" style="cursor:pointer" data-m="${x.m.id}">
    <span class="chip ${x.c}">${esc(x.t)}</span><b class="small">${esc(x.m.name)}</b><span class="muted small">${esc(x.m.district || "")}</span></div>`).join("")}
    ${items.length > 12 ? `<a href="#/mosques" class="small">و${items.length - 12} أخرى…</a>` : ""}</div>` : `<div class="empty">${I.check}لا توجد إجراءات معلّقة 🎉</div>`;
  $$("#todo [data-m]", v).forEach((el) => el.onclick = () => go("/mosque/" + el.dataset.m));
}

function drawCharts(st) {
  destroyCharts();
  if (!window.Chart) {
    // مكتبة الرسوم تُحمّل مؤجلة؛ نرسم عند اكتمالها
    if (document.readyState !== "complete") window.addEventListener("load", () => $("#c-series") && drawCharts(st), { once: true });
    return;
  }
  Chart.defaults.font.family = cssVar("--font") || "IBM Plex Sans Arabic";
  Chart.defaults.color = cssVar("--ink-3");
  Chart.defaults.borderColor = cssVar("--line");
  const brand = cssVar("--brand"), gold = cssVar("--gold"), info = cssVar("--info");
  const labels = (st.series || []).map((s) => monthName(s.month).split(" ")[0]);
  const base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", rtl: true, labels: { usePointStyle: true, boxWidth: 8 } } } };
  const c1 = $("#c-series");
  if (c1) charts.push(new Chart(c1, { type: "bar", data: { labels, datasets: [
    { label: "تركيب", data: st.series.map((s) => s.installs), backgroundColor: gold, borderRadius: 6, maxBarThickness: 26 },
    { label: "تعبئة", data: st.series.map((s) => s.refills), backgroundColor: brand, borderRadius: 6, maxBarThickness: 26 },
    { label: "زيارات", data: st.series.map((s) => s.visits), backgroundColor: info, borderRadius: 6, maxBarThickness: 26 },
  ] }, options: { ...base, scales: { x: { reverse: true, grid: { display: false } }, y: { position: "right", beginAtZero: true, ticks: { precision: 0 } } } } }));
  const stg = st.stages || {};
  const keys = STAGE_ORDER.concat(["not_feasible", "suspended"]).filter((k) => stg[k]);
  const palette = { selected: "#b8b2a3", assigned: "#7fb2d4", data_done: "#2c6e9b", feasible: "#e2c27f", study_done: "#d99a3a", approved: gold, active: brand, not_feasible: "#c0392b", suspended: "#7d1f16" };
  const c2 = $("#c-stages");
  if (c2) charts.push(new Chart(c2, { type: "doughnut", data: { labels: keys.map((k) => STAGES[k].s), datasets: [{ data: keys.map((k) => stg[k]), backgroundColor: keys.map((k) => palette[k]), borderWidth: 2, borderColor: cssVar("--surface") }] },
    options: { ...base, cutout: "66%" } }));
  const c3 = $("#c-sat");
  if (c3) charts.push(new Chart(c3, { type: "line", data: { labels, datasets: [{ label: "متوسط الرضا", data: st.series.map((s) => s.satisfaction), borderColor: gold, backgroundColor: gold + "33", fill: true, tension: .35, spanGaps: true, pointRadius: 4 }] },
    options: { ...base, plugins: { legend: { display: false } }, scales: { y: { position: "right", min: 0, max: 5, ticks: { stepSize: 1 } }, x: { reverse: true, grid: { display: false } } } } }));
  const c4 = $("#c-dist");
  const dist = st.by_district || [];
  if (c4) charts.push(new Chart(c4, { type: "bar", data: { labels: dist.map((d) => d.district), datasets: [
    { label: "إجمالي", data: dist.map((d) => d.total), backgroundColor: cssVar("--line"), borderRadius: 5, maxBarThickness: 22 },
    { label: "مُركّب", data: dist.map((d) => d.active), backgroundColor: brand, borderRadius: 5, maxBarThickness: 22 },
  ] }, options: { ...base, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } } } }));
}

      $("#rows", v).innerHTML = list.slice(0, 600).map((m) => `<tr class="click" data-id="${m.id}">

async function mosqueForm(m = null) {
  const r = role();
  const body = `<form class="form" onsubmit="return false">
    ${fld("name", "اسم المسجد/الجامع", { value: m?.name, req: true, attrs: r !== "admin" ? "readonly" : "" })}
    ${fld("kind", "النوع", { value: m?.kind || "جامع", opts: ["جامع", "مسجد", "مصلى"] })}
    ${fld("district", "الحي", { value: m?.district, req: r === "association" })}
    ${fld("address", "العنوان / أقرب معلم", { value: m?.address })}
    ${fld("map_url", "رابط الموقع على الخريطة", { value: m?.map_url, type: "url", full: true, ph: "https://maps.google.com/…" })}
    ${fld("imam_name", "اسم الإمام", { value: m?.imam_name, req: r === "association" })}${fld("imam_phone", "جوال الإمام", { type: "tel", value: m?.imam_phone, ph: "05xxxxxxxx", req: r === "association" })}
    ${fld("muezzin_name", "اسم المؤذن", { value: m?.muezzin_name, req: r === "association" })}${fld("muezzin_phone", "جوال المؤذن", { type: "tel", value: m?.muezzin_phone, ph: "05xxxxxxxx", req: r === "association" })}
    ${fld("servant_name", "اسم خادم المسجد", { value: m?.servant_name, req: r === "association" })}${fld("servant_phone", "جوال خادم المسجد", { type: "tel", value: m?.servant_phone, ph: "05xxxxxxxx", req: r === "association" })}
    ${r === "admin" ? fld("association_id", "الجمعية المشرفة", { value: m?.association_id || "", opts: [["", "— بدون إسناد الآن —"], ...S.associations.filter((a) => a.active).map((a) => [a.id, a.name])], hint: m ? "لتغيير الإسناد استخدم زر «إسناد»" : "سيُسند المسجد وينتقل لمرحلة استكمال البيانات", attrs: m ? "disabled" : "" }) : ""}
    ${r === "admin" && m ? fld("refill_cycle_days", "دورة التعبئة (يوم)", { type: "number", value: m.refill_cycle_days || "", ph: String(S.settings.refill_cycle_days || 30) }) : ""}
    ${fld("notes", "ملاحظات", { type: "textarea", value: m?.notes, full: true })}
  </form>`;
  return modal({
    title: m ? "تعديل بيانات المسجد" : "إضافة مسجد", body, wide: true,
    actions: [{ label: `${I.check} حفظ`, cls: "primary", onClick: async (mb) => {
      const d = formData(mb);
      if (!d.name) { toast("اسم المسجد مطلوب", "err"); return false; }
      ["imam_phone", "muezzin_phone", "servant_phone"].forEach((k) => { if (d[k]) d[k] = displayPhone(d[k]); });
      const assoc = d.association_id; delete d.association_id;
      if (d.refill_cycle_days !== undefined) d.refill_cycle_days = d.refill_cycle_days ? +d.refill_cycle_days : null;
      Object.keys(d).forEach((k) => { if (d[k] === "") d[k] = null; });
      if (r !== "admin") delete d.name;
      if (m) {
        const { error } = await sb.from("mosques").update(d).eq("id", m.id);
        if (error) { toast(errMsg(error), "err"); return false; }
        await refreshMosque(m.id); toast("تم الحفظ"); return true;
      }
      const { data, error } = await sb.from("mosques").insert({ ...d, created_by: S.me.id }).select().single();
      if (error) { toast(errMsg(error), "err"); return false; }
      if (assoc) await sb.rpc("assign_mosques", { p_ids: [data.id], p_assoc: assoc });
      await loadMosques(true); toast("تمت إضافة المسجد"); return data;
    } }, { label: "إلغاء" }],
  });
}

async function assignDialog(ids) {
  if (!ids.length) return;
  const active = S.associations.filter((a) => a.active);
  if (!active.length) { toast("أضف جمعية أولًا من صفحة الجمعيات", "err"); return; }
  return modal({
    title: `إسناد ${ids.length} مسجد لجمعية مشرفة`,
    body: `<div class="stack">${fld("assoc", "الجمعية المشرفة", { opts: active.map((a) => [a.id, a.name]) })}
      <div class="hint">المساجد في مرحلة «بانتظار الإسناد» تنتقل لمرحلة «استكمال البيانات»، ويصل إشعار لحسابات الجمعية.</div></div>`,
    actions: [{ label: `${I.check} إسناد`, cls: "primary", onClick: async (mb) => {
      const { data, error } = await sb.rpc("assign_mosques", { p_ids: ids, p_assoc: $('[name="assoc"]', mb).value });
      if (error) { toast(errMsg(error), "err"); return false; }
      await loadMosques(true); toast(`تم إسناد ${data} مسجد`); return true;
    } }, { label: "إلغاء" }],
  });
}

};
const normH = (s) => String(s || "").trim().replace(/[إأآ]/g, "ا").replace(/ة/g, "ه").replace(/\s+/g, " ").toLowerCase();
function guessColumn(header) {
  const h = normH(header);
  let best = null;
  for (const [k, names] of Object.entries(IMPORT_MAP)) for (const n of names) {
    const nn = normH(n);
    if (h === nn) return k;
    if (!best && (h.includes(nn) && nn.length > 3)) best = k;
  }
  // الأعمدة المركبة مثل «جوال الإمام» يجب ألا تُطابق «الإمام» فقط
  if (best && best.endsWith("_name") && /جوال|رقم|هاتف|phone|mobile/.test(h)) best = best.replace("_name", "_phone");
  return best;
}
function downloadTemplate() {
  exportXlsx([{ "اسم المسجد": "", "النوع": "جامع", "الحي": "", "العنوان": "", "رابط الموقع": "", "اسم الإمام": "", "جوال الإمام": "", "اسم المؤذن": "", "جوال المؤذن": "", "اسم الخادم": "", "جوال الخادم": "", "الجمعية": "", "ملاحظات": "" }], "نموذج-استيراد-المساجد.xlsx", "المساجد");
}
async function importDialog() {
  const body = document.createElement("div");
  body.innerHTML = `<div class="stack">
    <div class="row"><div class="grow small muted">يقبل ملفات Excel ‏(xlsx/xls) أو CSV. الصف الأول عناوين الأعمدة، ويتعرف النظام تلقائيًا على: اسم المسجد، الحي، اسم وجوال الإمام والمؤذن والخادم، الجمعية…</div>
      <button class="btn sm" data-tpl>${I.download} تحميل النموذج</button></div>
    <div class="drop" data-pick>${I.excel.replace("<svg", '<svg style="width:30px;height:30px;display:block;margin:0 auto 6px"')}اختر ملف Excel</div><input type="file" accept=".xlsx,.xls,.csv" hidden>
    <div data-map></div><div data-prev></div></div>`;
  let rows = [], mapping = {};
  const input = $("input", body);
  $("[data-tpl]", body).onclick = downloadTemplate;
  $("[data-pick]", body).onclick = () => input.click();
  const preview = () => {
    const known = new Set(S.mosques.map((m) => normH(m.name) + "|" + normH(m.district)));
    const out = rows.map((row) => {
      const o = {};
      for (const [col, key] of Object.entries(mapping)) if (key) o[key] = String(row[col] ?? "").trim();
      return o;
    }).filter((o) => o.name);
    out.forEach((o) => { o._dup = known.has(normH(o.name) + "|" + normH(o.district)); });
    body._out = out;
    const unknownAssoc = [...new Set(out.map((o) => o.association).filter((a) => a && !S.associations.some((x) => normH(x.name) === normH(a))))];
    $("[data-prev]", body).innerHTML = `<div class="row small" style="margin:6px 0"><b>${out.length} صف صالح</b>
      <span class="chip warn plain">${out.filter((o) => o._dup).length} مكرر (سيُتجاوز)</span>
      ${unknownAssoc.length ? `<span class="chip bad plain">جمعيات غير معرّفة: ${esc(unknownAssoc.join("، "))}</span>` : ""}</div>
      <div class="tbl-wrap" style="max-height:300px;border:1px solid var(--line);border-radius:10px"><table class="tbl"><thead><tr><th>المسجد</th><th>الحي</th><th>الإمام</th><th>جوال الإمام</th><th>المؤذن</th><th>الخادم</th><th>الجمعية</th></tr></thead>
      <tbody>${out.slice(0, 100).map((o) => `<tr style="${o._dup ? "opacity:.45" : ""}"><td>${esc(o.name)}</td><td>${esc(o.district || "")}</td><td>${esc(o.imam_name || "")}</td><td class="num">${esc(o.imam_phone || "")}</td><td>${esc(o.muezzin_name || "")}</td><td>${esc(o.servant_name || "")}</td><td>${esc(o.association || "")}</td></tr>`).join("")}</tbody></table></div>`;
  };
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
    } catch (e) { toast("تعذّرت قراءة الملف: " + e.message, "err"); return; }
    if (!rows.length) { toast("الملف فارغ", "err"); return; }
    const headers = Object.keys(rows[0]);
    mapping = Object.fromEntries(headers.map((h) => [h, guessColumn(h)]));
    $("[data-pick]", body).innerHTML = `${I.check} ${esc(file.name)} — ${rows.length} صف`;
    const opts = [["", "— تجاهل —"], ...Object.keys(IMPORT_MAP).map((k) => [k, { name: "اسم المسجد", kind: "النوع", district: "الحي", address: "العنوان", map_url: "رابط الموقع", imam_name: "اسم الإمام", imam_phone: "جوال الإمام", muezzin_name: "اسم المؤذن", muezzin_phone: "جوال المؤذن", servant_name: "اسم الخادم", servant_phone: "جوال الخادم", association: "الجمعية", notes: "ملاحظات" }[k]])];
    $("[data-map]", body).innerHTML = `<div class="small" style="font-weight:600;margin-bottom:6px">مطابقة الأعمدة</div><div class="form" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${headers.map((h) =>
      `<div class="field"><label>${esc(h)}</label><select class="input" data-col="${esc(h)}">${opts.map(([v, l]) => `<option value="${v}" ${mapping[h] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`).join("")}</div>`;
    $$("[data-col]", body).forEach((s) => s.onchange = () => { mapping[s.dataset.col] = s.value; preview(); });
    if (!Object.values(mapping).includes("name")) toast("حدد عمود «اسم المسجد» من المطابقة", "err");
    preview();
  };
  await modal({
    title: "استيراد المساجد من Excel", body, wide: true,
    actions: [{ label: `${I.upload} استيراد`, cls: "primary", onClick: async () => {
      const out = (body._out || []).filter((o) => !o._dup);
      if (!out.length) { toast("لا توجد صفوف جديدة للاستيراد", "err"); return false; }
      const byAssoc = {};
      const recs = out.map((o) => {
        const a = o.association && S.associations.find((x) => normH(x.name) === normH(o.association));
        const rec = { created_by: S.me.id };
        for (const k of Object.keys(IMPORT_MAP)) if (k !== "association" && o[k]) rec[k] = k.endsWith("_phone") ? displayPhone(o[k]) : o[k];
        if (rec.kind && !["جامع", "مسجد", "مصلى"].includes(rec.kind)) rec.kind = rec.kind.includes("مسجد") ? "مسجد" : rec.kind.includes("مصل") ? "مصلى" : "جامع";
        rec._assoc = a?.id;
        return rec;
      });
      let ok = 0;
      for (let i = 0; i < recs.length; i += 200) {
        const chunk = recs.slice(i, i + 200);
        const { data, error } = await sb.from("mosques").insert(chunk.map(({ _assoc, ...r }) => r)).select("id");
        if (error) { toast(errMsg(error), "err"); break; }
        data.forEach((d, j) => { const a = chunk[j]._assoc; if (a) (byAssoc[a] = byAssoc[a] || []).push(d.id); });
        ok += data.length;
      }
      for (const [a, ids] of Object.entries(byAssoc)) await sb.rpc("assign_mosques", { p_ids: ids, p_assoc: a });
      await loadMosques(true);
      toast(`تم استيراد ${ok} مسجد`);
      render();
      return true;
    } }, { label: "إلغاء" }],
  });
}

        if (await run(sb.rpc("complete_data", { p_mosque: id }), "تم اعتماد اكتمال البيانات — الخطوة التالية: التواصل مع الإمام")) { await refreshMosque(id); render(); }
      } else if (a === "decide") decideDialog(m, reports || [], attBy);
      else if (await openReportForm(m, a)) render();
    });
  },
});
function hasType(reports, step) {
  const t = { 8: "visit", 9: "satisfaction", 10: "monthly", 11: "refill", 12: "refill" }[step];
  return t && (reports || []).some((r) => r.type === t);
}

function printMosque(m, reports) {

const T_STATUS = { open: ["مفتوحة", "info"], in_progress: ["قيد التنفيذ", "warn"], done: ["منجزة", "ok"], cancelled: ["ملغاة", "plain"] };
const T_PRIO = { low: ["منخفضة", "plain"], normal: ["عادية", "plain"], high: ["عالية", "warn"], urgent: ["عاجلة", "bad"] };
const T_ASSIGNEE = { admin: "مدير النظام", association: "الجمعية", company: "الشركة المنفذة" };
const taskWho = (t) => t.assignee === "association" ? assocName(t.association_id) : T_ASSIGNEE[t.assignee];

function tasksTable(tasks, { mosque = true } = {}) {
  if (!tasks.length) return `<div class="empty">${I.tasks}لا توجد مهام أو طلبات</div>`;
  return `<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>المهمة</th>${mosque ? "<th>المسجد</th>" : ""}<th>الجهة المكلفة</th><th>الأولوية</th><th>الاستحقاق</th><th>الحالة</th></tr></thead><tbody>
    ${tasks.map((t) => {
      const late = t.due_date && !["done", "cancelled"].includes(t.status) && t.due_date < isoDay();
      return `<tr class="click" data-task="${t.id}"><td><div class="t-name">${t.kind === "request" ? `<span class="chip gold plain small">طلب</span> ` : ""}${esc(t.title)}</div><div class="muted small">${ago(t.created_at)}</div></td>
      ${mosque ? `<td data-hide-sm>${t.mosque_id ? esc(mosqueById(t.mosque_id)?.name || "—") : `<span class="muted">عام</span>`}</td>` : ""}
      <td data-hide-sm>${esc(taskWho(t))}</td><td data-hide-sm><span class="chip ${T_PRIO[t.priority][1]}">${T_PRIO[t.priority][0]}</span></td>
      <td data-hide-sm class="${late ? "" : "muted"}" style="${late ? "color:var(--bad);font-weight:600" : ""}">${t.due_date ? fmtDate(t.due_date) : "—"}</td>
      <td><span class="chip ${T_STATUS[t.status][1]}">${T_STATUS[t.status][0]}</span></td></tr>`;
    }).join("")}</tbody></table></div>`;
}
function bindTaskRows(root) { $$("[data-task]", root).forEach((tr) => tr.onclick = () => go("/tasks/" + tr.dataset.task)); }

async function taskForm(pre = {}) {
  const r = role();

  const assignees = r === "admin" ? [["association", "الجمعية المشرفة"], ["company", "الشركة المنفذة"], ["admin", "مدير النظام"]]
    : r === "association" ? [["admin", "طلب إلى مدير النظام"], ["association", "مهمة داخلية للجمعية"]] : [["admin", "طلب إلى مدير النظام"]];

    ${fld("mosque_id", "المسجد", { value: pre.mosque_id || "", opts: [["", "— عام (غير مرتبط بمسجد) —"], ...mosques.map((m) => [m.id, `${m.name} — ${m.code}`])] })}
    ${fld("assignee", r === "admin" ? "الجهة المكلفة" : "الوجهة", { value: pre.assignee || assignees[0][0], opts: assignees })}

    ${fld("priority", "الأولوية", { value: "normal", opts: Object.entries(T_PRIO).map(([k, x]) => [k, x[0]]) })}
    ${fld("due_date", "تاريخ الاستحقاق", { type: "date" })}
    ${fld("details", "التفاصيل", { type: "textarea", full: true })}

  return modal({

      if (rec.assignee === "association" && !rec.association_id && !rec.mosque_id) { toast("حدد الجمعية أو المسجد", "err"); return false; }
      const { data, error } = await sb.from("tasks").insert(rec).select().single();

      if (up.files.length) await uploadFiles(up.files, { taskId: data.id, mosqueId: null, ui: up });

route("tasks", {

      <div class="card" id="list"></div>`;
    const draw = () => { $("#list", v).innerHTML = tasksTable(tasks.filter(groups[f][1])); bindTaskRows(v); };

    $("#new", v)?.addEventListener("click", async () => { if (await taskForm()) render(); });
    draw();
  },
});

route("refills", {
  title: "جدول التعبئة والزيارات",
  async render(v) {
    await loadMosques();
    const r = role();
    const active = S.mosques.filter((m) => m.stage === "active");
    const rh = S.settings.reminder_hours || 72, vd = S.settings.visit_every_days || 7;

    const overdue = active.filter((m) => h(m) < 0).sort((a, b) => h(a) - h(b));
    const soon = active.filter((m) => h(m) >= 0 && h(m) <= rh).sort((a, b) => h(a) - h(b));
    const later = active.filter((m) => h(m) > rh).sort((a, b) => h(a) - h(b));

        <div class="card kpi alert"><div class="lbl">${I.alert}متأخرة</div><div class="val">${overdue.length}</div></div>
        <div class="card kpi warn"><div class="lbl">${I.clock}خلال ${rh} ساعة</div><div class="val">${soon.length}</div><div class="sub">يصل تذكير آلي للشركة</div></div>
        <div class="card kpi"><div class="lbl">${I.drop}مجدولة لاحقًا</div><div class="val">${later.length}</div></div>
        <div class="card kpi"><div class="lbl">${I.visit}زيارات أسبوعية مستحقة</div><div class="val">${visitDue.length}</div></div>
      </div>
      <div class="stack">
        <div class="card"><div class="hd"><h3>تعبئات متأخرة</h3><span class="chip bad">${overdue.length}</span></div>${tbl(overdue, "لا توجد تعبئات متأخرة ✓")}</div>
        <div class="card"><div class="hd"><h3>تعبئات خلال ${rh} ساعة</h3><span class="chip warn">${soon.length}</span></div>${tbl(soon, "لا توجد تعبئات قريبة")}</div>
        <div class="card"><div class="hd"><h3>الجدول القادم</h3><button class="btn sm right" id="exp">${I.download} تصدير</button></div>${tbl(later, "لا توجد مساجد قيد التشغيل بعد")}</div>

            <td onclick="event.stopPropagation()">${r !== "viewer" ? `<button class="btn sm" data-visit="${m.id}">${I.visit} رفع زيارة</button>` : ""}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">جميع الزيارات محدثة ✓</div>`}</div>` : ""}

// تقرير شهري مجمع: أداء التعطير في كل مسجد خلال شهر
async function monthlyCompound() {
  const ym = await modal({ title: "التقرير الشهري المجمع", body: fld("m", "الشهر", { type: "month", value: monthKey() }),
    actions: [{ label: `${I.print} إنشاء التقرير`, cls: "primary", onClick: (mb) => $('[name="m"]', mb).value }, { label: "إلغاء" }] });
  if (!ym) return;
  const start = new Date(ym + "-01T00:00:00"), end = new Date(start); end.setMonth(end.getMonth() + 1);
  const { data } = await sb.from("reports").select("*").gte("created_at", start.toISOString()).lt("created_at", end.toISOString());
  const { data: monthlies } = await sb.from("reports").select("*").eq("type", "monthly").filter("data->>month", "eq", ym);
  const rs = data || [];
  const active = S.mosques.filter((m) => m.stage === "active" || rs.some((x) => x.mosque_id === m.id));
  const rows = active.map((m) => {
    const mine = rs.filter((x) => x.mosque_id === m.id);
    const sat = mine.filter((x) => x.type === "satisfaction" && x.data?.overall).map((x) => +x.data.overall);
    const mr = (monthlies || []).find((x) => x.mosque_id === m.id);
    return { m, visits: mine.filter((x) => x.type === "visit").length, issues: mine.filter((x) => x.type === "visit" && x.data?.status === "issue").length,
      refills: mine.filter((x) => x.type === "refill").length, sat: sat.length ? (sat.reduce((a, b) => a + b, 0) / sat.length).toFixed(2) : "—", perf: mr?.data?.performance ? `${mr.data.performance}/5` : "لم يُرفع" };
  });
  printDoc(`التقرير الشهري — ${monthName(ym)}`, `<h2>ملخص الشهر</h2><table>
    <tr><th>المساجد قيد التشغيل</th><td>${rows.length}</td></tr><tr><th>إجمالي الزيارات</th><td>${rows.reduce((a, x) => a + x.visits, 0)}</td></tr>
    <tr><th>إجمالي التعبئات</th><td>${rows.reduce((a, x) => a + x.refills, 0)}</td></tr><tr><th>الملاحظات الفنية</th><td>${rows.reduce((a, x) => a + x.issues, 0)}</td></tr>
    <tr><th>التقارير الشهرية المرفوعة</th><td>${rows.filter((x) => x.perf !== "لم يُرفع").length} من ${rows.length}</td></tr></table>
    <h2>أداء التعطير في كل مسجد</h2><table><tr><th style="width:auto">المسجد</th><th style="width:auto">الجمعية</th><th style="width:auto">زيارات</th><th style="width:auto">تعبئات</th><th style="width:auto">ملاحظات</th><th style="width:auto">الرضا</th><th style="width:auto">تقييم الأداء</th></tr>
    ${rows.map((x) => `<tr><td>${esc(x.m.name)}</td><td>${esc(assocName(x.m.association_id))}</td><td>${x.visits}</td><td>${x.refills}</td><td>${x.issues}</td><td>${x.sat}</td><td>${x.perf}</td></tr>`).join("")}</table>`);
}

});

const fillVars = (t, x) => t.replace(/\{الاسم\}/g, x.name || "").replace(/\{المسجد\}/g, x.mosque || "").replace(/\{الحي\}/g, x.district || "").replace(/\s+،/g, "،").trim();

// قائمة إرسال: كل رقم يُفتح في واتساب برسالة مخصصة، مع تتبع ما أُرسل
async function sendQueue(b) {
  const rec = b.recipients || [];
  const body = document.createElement("div");
  let saveT = null;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => sb.from("broadcasts").update({ recipients: rec }).eq("id", b.id), 600); };
  const draw = () => {
    const sent = rec.filter((x) => x.sent).length;
    body.innerHTML = `<div class="hint" style="margin-bottom:10px">يفتح زر «إرسال» محادثة واتساب بالرسالة جاهزة لكل رقم — اضغط «إرسال» في واتساب ثم عد للقائمة. يمكنك أيضًا «إرسال التالي» للتنقل السريع.</div>
      <div class="row" style="margin-bottom:10px"><div class="bar grow"><i style="width:${rec.length ? sent / rec.length * 100 : 0}%"></i></div><b class="num">${sent} / ${rec.length}</b></div>
      <div class="row" style="margin-bottom:12px"><button class="btn primary" data-next ${sent === rec.length ? "disabled" : ""}>${I.wa} إرسال التالي</button>
        <button class="btn sm" data-copy>${I.copy} نسخ الأرقام</button><button class="btn sm" data-xls>${I.download} تصدير القائمة</button></div>
      <div class="tbl-wrap" style="max-height:50vh;border:1px solid var(--line);border-radius:10px"><table class="tbl"><tbody>${rec.map((x, i) => `<tr style="${x.sent ? "opacity:.55" : ""}">
        <td><b>${esc(x.name || "—")}</b><div class="small muted">${esc(x.mosque || "")}</div></td><td class="num" dir="ltr">${esc(displayPhone(x.phone))}</td>
        <td><a class="btn sm ${x.sent ? "" : "primary"}" data-send="${i}" href="${esc(waLink(x.phone, fillVars(b.body, x)))}" target="_blank" rel="noopener">${I.wa} ${x.sent ? "أُرسلت ✓" : "إرسال"}</a></td>
        <td><label class="small"><input type="checkbox" data-mark="${i}" ${x.sent ? "checked" : ""}> تم</label></td></tr>`).join("")}</tbody></table></div>`;
  };
  body.onclick = (e) => {
    const s = e.target.closest("[data-send]");
    if (s) { rec[+s.dataset.send].sent = true; save(); setTimeout(draw, 50); return; }
    const mk = e.target.closest("[data-mark]");
    if (mk) { rec[+mk.dataset.mark].sent = mk.checked; save(); draw(); return; }
    if (e.target.closest("[data-next]")) { const i = rec.findIndex((x) => !x.sent); if (i >= 0) { window.open(waLink(rec[i].phone, fillVars(b.body, rec[i])), "_blank", "noopener"); rec[i].sent = true; save(); draw(); } }
    if (e.target.closest("[data-copy]")) { navigator.clipboard.writeText(rec.map((x) => "+" + x.phone).join("\n")).then(() => toast("تم نسخ الأرقام")); }

  };

  const inp = $("input", body), res = $("[data-res]", body);
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { res.innerHTML = ""; return; }
    const hits = S.mosques.filter((m) => [m.name, m.code, m.district, m.imam_name, normPhone(m.imam_phone), m.muezzin_name, m.servant_name].some((x) => String(x || "").toLowerCase().includes(q))).slice(0, 12);
    res.innerHTML = hits.map((m) => `<a class="row" href="#/mosque/${m.id}" style="padding:8px 10px;border-radius:10px;color:var(--ink)" data-hit><b>${esc(m.name)}</b><span class="muted small">${esc(m.code)} · ${esc(m.district || "")}</span><span class="right">${stageChip(m.stage)}</span></a>`).join("") || `<div class="muted small">لا نتائج</div>`;
  };
  modal({ title: "بحث سريع", body, onOpen: (mb, close) => { mb.addEventListener("click", (e) => { if (e.target.closest("[data-hit]")) close(); }); } });
}

let current = null;
async function render() {
  if (!S.me) return;
  parseHash();
  const allowed = NAV.find((n) => n.r === S.route)?.roles || (S.route === "mosque" ? ["admin", "association", "company"] : null);
  if (!ROUTES[S.route] || (allowed && !allowed.includes(role()))) { location.hash = "/dashboard"; return; }
  current?.leave?.();
  current = ROUTES[S.route];
  const navKey = S.route === "mosque" ? "mosques" : S.route;
  $$(".nav a, .bnav a").forEach((a) => a.classList.toggle("on", a.dataset.r === navKey));
  $(".topbar h1").textContent = current.title;
  const v = $("#view");
  v.scrollTop = 0; window.scrollTo(0, 0);
  try { await current.render(v); } catch (e) { console.error(e); v.innerHTML = `<div class="empty">${I.alert}حدث خطأ: ${esc(errMsg(e))}</div>`; }
}

// ───── شاشة الدخول والتفعيل ─────
function paintLogin(msg = "") {
  const app = $("#app");
  app.classList.add("auth");
  $(".side").innerHTML = ""; $(".topbar").innerHTML = ""; $(".bnav").innerHTML = "";
  $("#view").innerHTML = `<div class="login">
    <div class="art"><div class="pattern"></div>
      <div style="position:relative"><div style="width:76px;height:76px;margin-bottom:22px">${logoHtml()}</div>
        <h1>${esc(S.settings.platform_name || "طيب")}</h1><div class="tag">${esc(S.settings.org_name || "مشروع تعطير مساجد الرياض")}</div>
        <p>منصة متكاملة لإدارة تعطير بيوت الله: من اختيار المساجد وإسنادها للجمعيات المشرفة، إلى دراسة الاحتياج والتركيب والتعبئة الدورية وقياس رضا المصلين.</p></div>
      <div class="feat">${[["mosque", "ملف متكامل لكل مسجد وفريقه"], ["drop", "تذكير آلي قبل موعد التعبئة بـ ٧٢ ساعة"], ["report", "تقارير الزيارات والرضا والأداء الشهري"], ["wa", "تواصل مباشر عبر واتساب والبريد"]].map(([i, t]) => `<div>${I[i]}${t}</div>`).join("")}</div>
      <div class="small" style="position:relative;color:#9fc1b5">﴿ فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ ﴾</div></div>
    <div class="panel"><div class="box">
      <div class="seg" id="mode" style="margin-bottom:22px"><button data-m="in" class="on">تسجيل الدخول</button><button data-m="up">تفعيل حساب جديد</button></div>
      <h2 id="lt">مرحبًا بك</h2><p class="muted small" id="ls" style="margin-top:0">سجّل الدخول بالبريد وكلمة المرور</p>
      <form class="stack" id="lf">
        ${fld("email", "البريد الإلكتروني", { type: "email", req: true, attrs: 'autocomplete="email"' })}
        ${fld("password", "كلمة المرور", { type: "password", req: true, attrs: 'autocomplete="current-password" minlength="8"' })}
        <div data-code hidden>${fld("code", "رمز التفعيل", { hint: "يصلك من مدير النظام عند إنشاء حسابك", attrs: 'dir="ltr" autocomplete="one-time-code" style="letter-spacing:3px;text-transform:uppercase"' })}</div>
        <button class="btn primary" style="padding:11px" id="lb">دخول</button>
        <div class="hint" id="lh">نسيت كلمة المرور؟ تواصل مع مدير النظام لإعادة تعيين الدخول.</div>
        ${msg ? `<div class="chip bad plain" style="white-space:normal;padding:8px 12px">${esc(msg)}</div>` : ""}
      </form></div></div></div>`;
  let mode = "in";
  $("#mode").onclick = (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    mode = b.dataset.m;
    $$("#mode button").forEach((x) => x.classList.toggle("on", x === b));
    $("[data-code]").hidden = mode !== "up";
    $("#lt").textContent = mode === "in" ? "مرحبًا بك" : "تفعيل حساب جديد";
    $("#ls").textContent = mode === "in" ? "سجّل الدخول بالبريد وكلمة المرور" : "أدخل بريدك ورمز التفعيل، واختر كلمة مرور (٨ أحرف على الأقل)";
    $("#lb").textContent = mode === "in" ? "دخول" : "تفعيل الحساب";
    $('[name="password"]').autocomplete = mode === "in" ? "current-password" : "new-password";
  };
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    const d = formData($("#lf"));
    const btn = $("#lb"); btn.disabled = true;
    try {
      const email = d.email.toLowerCase();
      if (mode === "in") {
        const { error } = await sb.auth.signInWithPassword({ email, password: d.password });
        if (error) throw new Error(/invalid/i.test(error.message) ? "البريد أو كلمة المرور غير صحيحة" : error.message);
      } else {
        if (!d.code) throw new Error("أدخل رمز التفعيل");
        if (d.password.length < 8) throw new Error("كلمة المرور ٨ أحرف على الأقل");
        let { data, error } = await sb.auth.signUp({ email, password: d.password });
        if (error && /already|registered|exists/i.test(error.message)) ({ data, error } = await sb.auth.signInWithPassword({ email, password: d.password }));
        if (error) throw new Error(/already|registered|exists|invalid/i.test(error.message) ? "هذا البريد مسجل مسبقًا بكلمة مرور أخرى — اطلب من المدير إعادة تعيين الدخول" : error.message);
        if (!error && !data.session) {
          // البريد مسجل ومؤكد مسبقًا (يعيد الخادم مستخدمًا بلا جلسة) أو ينتظر التأكيد: نجرب الدخول مباشرة
          const r = await sb.auth.signInWithPassword({ email, password: d.password });
          if (r.data?.session) data = r.data;
          else if (/confirm/i.test(r.error?.message || "")) throw new Error("لم يُؤكَّد البريد بعد — يرجى إبلاغ مدير النظام بتعطيل «Confirm email» في إعدادات Supabase");
          else throw new Error("هذا البريد مسجل مسبقًا بكلمة مرور أخرى — استخدم كلمة المرور نفسها أو اطلب من المدير إعادة تعيين الدخول");
        }
        const { error: e2 } = await sb.rpc("claim_account", { p_code: d.code });
        if (e2) { await sb.auth.signOut(); throw new Error(e2.message); }
      }
      await boot();
    } catch (err) { toast(err.message, "err"); }
    finally { btn.disabled = false; }
  };
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return paintLogin();
  const { data: me, error } = await sb.rpc("me");
  if (error || !me?.id) {
    await sb.auth.signOut();
    return paintLogin("حسابك غير مفعّل في المنصة. إن كان لديك رمز تفعيل فاختر «تفعيل حساب جديد»، وإلا تواصل مع مدير النظام.");
  }
  S.me = me;
  await Promise.all([loadAssociations(), loadNotifications()]);
  sb.rpc("touch_seen").then(() => {});
  paintShell();
  subscribeNotifications();
  if (!location.hash) location.hash = "/dashboard";
  render();
}

(function init() {
  try { const t = localStorage.getItem("tayyib.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  window.addEventListener("hashchange", render);
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && S.me) location.reload(); });
  loadSettings().then(boot).catch((e) => { console.error(e); paintLogin("تعذّر الاتصال بالخادم"); });
})();

</script>
</body>
