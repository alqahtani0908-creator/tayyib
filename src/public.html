<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&!/^(localhost|127\.|\[::1\])/.test(location.hostname))location.replace("https://"+location.host+location.pathname+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#563331">
<title>طيب — رأيك يهمنا</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<!--CONFIG-->
<style>
:root{--brown:#563331;--brown2:#6b4340;--gold:#ceb26b;--gold2:#e6cf8f;--cream:#fbf8f2;--ink:#2b1a18;--ink2:#5e4d4a;--ink3:#8e817e;--line:#e8dfd1;--ok:#2f9e6a;--bad:#c4544a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#3f2523 0%,#563331 45%,#7a4f43 100%) fixed;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 15% 0%,rgba(206,178,107,.35),transparent 70%),radial-gradient(500px 300px at 100% 100%,rgba(206,178,107,.22),transparent 70%)}
.top{position:relative;width:100%;max-width:520px;display:flex;align-items:center;gap:12px;color:#fff;margin:6px 0 16px}
.top .logo{width:74px;height:40px;flex:none}.top .logo svg{width:100%;height:100%}
.top .t{display:grid;line-height:1.35}.top .t b{font-size:15px}.top .t span{font-size:12.5px;color:#e6d3a3}
.card{position:relative;width:100%;max-width:520px;background:rgba(251,248,242,.92);border:1px solid rgba(255,255,255,.6);border-radius:26px;box-shadow:0 30px 70px rgba(20,10,8,.35),inset 0 1px 0 #fff;padding:22px 20px;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);overflow:hidden}
.mq{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:16px}
.mq i{font-style:normal;font-size:22px}.mq b{display:block;font-size:15px}.mq small{color:var(--ink3);font-size:12.5px}
.mq button{all:unset;cursor:pointer;margin-inline-start:auto;font-size:12.5px;color:var(--brown);font-weight:600}
h1{margin:4px 0 6px;font-size:23px;line-height:1.35}
p.lead{margin:0 0 18px;color:var(--ink2);font-size:15px;line-height:1.8}
.big{display:grid;gap:12px}
.bigbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 22px rgba(86,51,49,.08);transition:transform .12s}
.bigbtn:active{transform:scale(.98)}
.bigbtn .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.bigbtn.alt .ic{background:linear-gradient(135deg,#f3d9d4,#e8b9b0)}
.bigbtn b{display:block;font-size:17px}.bigbtn small{color:var(--ink3);font-size:13px}
.bigbtn .go{margin-inline-start:auto;color:var(--ink3);font-size:20px}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:2px 0 16px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--brown));border-radius:6px;transition:width .3s}
.qn{font-size:13px;color:var(--ink3);margin-bottom:4px}
.q{font-size:21px;font-weight:700;line-height:1.5;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:16px;font-weight:600;transition:border-color .12s,background .12s}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--brown);background:#f7efe6}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on .dot{border-color:var(--brown);background:var(--brown)}.opt.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr;margin:6px 0 10px}
.star{all:unset;cursor:pointer;font-size:44px;line-height:1;color:#e2d8c6;transition:transform .12s,color .12s}
.star.on{color:var(--gold)}.star:active{transform:scale(.9)}
.slabel{text-align:center;font-weight:700;color:var(--brown);min-height:26px}
textarea,input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
textarea{min-height:130px;resize:vertical;line-height:1.7}
textarea:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(206,178,107,.25)}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600;margin-bottom:14px}
label.f small{font-weight:400;color:var(--ink3)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:12px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:700}
.seg button.on{border-color:var(--brown);background:var(--brown);color:#fff}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{all:unset;cursor:pointer;flex:1;text-align:center;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:var(--brown);color:#fff;box-shadow:0 10px 24px rgba(86,51,49,.3)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{flex:0 0 auto;padding:15px 18px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.list{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding:2px}
.find{margin-bottom:10px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.done{text-align:center;padding:16px 4px 6px}
.done .ok{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:42px;color:#fff;background:linear-gradient(135deg,#3fb27c,#2f9e6a);box-shadow:0 14px 30px rgba(47,158,106,.35)}
.done .ref{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.foot{position:relative;color:#d9c9a8;font-size:12px;margin-top:16px;text-align:center}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brown);margin:40px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><div class="logo"><svg viewBox="1000 36 962 492" xmlns="http://www.w3.org/2000/svg"><g fill="#ceb26b"><path fill-rule="evenodd" d="M1655 53H1697V195H1830A115 115 0 0 1 1945 310A115 115 0 0 1 1830 425H1180A113 113 0 0 1 1067 312V240C1067 205 1050 184 1017 176L1029 133C1082 146 1110 185 1110 240V318A62 62 0 0 0 1172 380H1536V217H1578V380H1655ZM1697 238V310H1902A72 72 0 0 0 1830 238Z"/><path d="M1307 445l33 33-33 33-33-33zM1523 445l33 33-33 33-33-33zM1589 445l33 33-33 33-33-33z"/></g></svg></div>
<div class="t"><b>مشروع تعطير مساجد الرياض</b><span>رأيك يهمّنا لخدمة بيوت الله</span></div></header>
<main class="card" id="app"><div class="spin"></div></main>
<div class="foot">لا نطلب أي بيانات شخصية إلا ما تختار مشاركته</div>
<script>
(() => {
  const cfg = window.TAYYIB_CONFIG || {};
  // طبقة الاتصال: دوال الخادم العامة فقط (أو بيانات وهمية في الاختبار المحلي)
  const rpc = window.TAYYIB_PUBLIC_RPC || (async (fn, args) => {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: cfg.supabaseKey, Authorization: `Bearer ${cfg.supabaseKey}`, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) });
    const t = await r.text(); let d = null; try { d = t ? JSON.parse(t) : null; } catch {}
    if (!r.ok) throw new Error(d?.message || "تعذر الاتصال، حاول مرة أخرى");
    return d;
  });
  const P = new URLSearchParams(location.search);
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const REG = { north: "شمال الرياض", south: "جنوب الرياض", east: "شرق الرياض", west: "غرب الرياض", center: "وسط الرياض" };
  const view = (html) => { app.innerHTML = `<div class="fade">${html}</div>`; window.scrollTo({ top: 0, behavior: "smooth" }); };
  const state = { mosque: null, places: null, survey: null };
  const mqCard = (change = true) => state.mosque ? `<div class="mq"><i>🕌</i><div><b>${esc(state.mosque.name)}</b><small>${esc([state.mosque.district, REG[state.mosque.region]].filter(Boolean).join(" • "))}</small></div>${change && !P.get("m") ? `<button data-change>تغيير</button>` : ""}</div>` : "";
  const bindChange = (next) => app.querySelector("[data-change]")?.addEventListener("click", () => { state.mosque = null; pickMosque(next); });

  // ───── الصفحة الرئيسية للمسجد: تقييم أو شكوى ─────
  function home() {
    view(`${mqCard()}<h1>أهلًا بك 👋</h1><p class="lead">ساعدنا في العناية بطيب بيوت الله، اختر ما تريد:</p>
      <div class="big"><button class="bigbtn" data-go="survey"><span class="ic">⭐</span><span><b>قيّم رائحة المسجد</b><small>استبيان قصير أقل من دقيقة</small></span><span class="go">‹</span></button>
      <button class="bigbtn alt" data-go="complaint"><span class="ic">💬</span><span><b>شكوى أو اقتراح</b><small>نصل لها ونتعامل معها</small></span><span class="go">‹</span></button></div>`);
    app.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => b.dataset.go === "survey" ? startSurvey() : complaintForm());
  }

  // ───── تضييق نطاق المسجد: الجهة ← الحي ← المسجد ─────
  async function pickMosque(next) {
    if (!state.places) { view(`<div class="spin"></div>`); try { state.places = await rpc("public_places"); } catch (e) { return view(`<p class="err">${esc(e.message)}</p>`); } }
    const all = state.places || [];
    if (!all.length) return view(`<h1>لا توجد مساجد متاحة حاليًا</h1><p class="lead">امسح الباركود الموجود في المسجد مباشرة.</p>`);
    const step = (title, sub, items, onPick, back) => {
      view(`<div class="qn">${esc(sub)}</div><h1>${esc(title)}</h1>${items.length > 8 ? `<input class="find" placeholder="ابحث…" aria-label="بحث">` : ""}
        <div class="list">${items.map(([k, l, n], i) => `<button class="opt" data-i="${i}"><span class="dot"></span><span style="flex:1">${esc(l)}</span>${n ? `<small style="color:var(--ink3)">${n}</small>` : ""}</button>`).join("")}</div>
        ${back ? `<div class="nav"><button class="btn ghost" data-back>رجوع</button></div>` : ""}`);
      app.querySelectorAll(".opt").forEach((b) => b.onclick = () => onPick(items[+b.dataset.i][0]));
      app.querySelector("[data-back]")?.addEventListener("click", back);
      const f = app.querySelector(".find"); if (f) f.oninput = () => app.querySelectorAll(".opt").forEach((b) => b.hidden = !b.textContent.includes(f.value.trim()));
    };
    const regions = [...new Set(all.map((x) => x.r || ""))];
    const chooseRegion = () => regions.length > 1
      ? step("في أي جهة من الرياض يقع المسجد؟", "الخطوة 1 من 3", regions.map((r) => [r, REG[r] || "أخرى", all.filter((x) => (x.r || "") === r).length]), chooseDistrict)
      : chooseDistrict(regions[0], true);
    const chooseDistrict = (r, single) => {
      const list = all.filter((x) => (x.r || "") === r), ds = [...new Set(list.map((x) => x.d))].sort((a, b) => a.localeCompare(b, "ar"));
      ds.length > 1 ? step("في أي حي؟", "الخطوة 2 من 3", ds.map((d) => [d, d, list.filter((x) => x.d === d).length]), (d) => chooseMosque(r, d), single ? null : chooseRegion) : chooseMosque(r, ds[0]);
    };
    const chooseMosque = (r, d) => {
      const list = all.filter((x) => (x.r || "") === r && x.d === d);
      step("اختر المسجد", "الخطوة 3 من 3", list.map((x) => [x.t, x.n]), (t) => { const x = list.find((y) => y.t === t); state.mosque = { token: x.t, name: x.n, district: x.d, region: x.r }; next(); }, () => chooseDistrict(r));
    };
    chooseRegion();
  }

  // ───── الاستبيان: سؤال يتبع سؤالًا ─────
  async function startSurvey() {
    if (!state.mosque) return pickMosque(startSurvey);
    if (!state.survey) { view(`<div class="spin"></div>`); try { state.survey = await rpc("public_survey", { p_id: P.get("s") || null }); } catch (e) { return view(`<p class="err">${esc(e.message)}</p>`); } }
    const s = state.survey;
    if (!s || !(s.questions || []).length) return view(`${mqCard()}<h1>لا يوجد استبيان متاح حاليًا</h1><p class="lead">شكرًا لاهتمامك، يمكنك إرسال شكوى أو اقتراح.</p><div class="nav"><button class="btn" data-c>شكوى أو اقتراح</button></div>`), app.querySelector("[data-c]").onclick = complaintForm;
    const Q = s.questions, ans = {};
    const intro = () => {
      view(`${mqCard()}<h1>${esc(s.title)}</h1><p class="lead">${esc(s.intro || "إجابتك تساعدنا على تحسين تعطير المسجد. لن يستغرق الأمر أكثر من دقيقة.")}</p>
        <div class="nav"><button class="btn" data-start>ابدأ</button></div>`);
      bindChange(startSurvey);
      app.querySelector("[data-start]").onclick = () => ask(0);
    };
    const ask = (i) => {
      if (i >= Q.length) return submit();
      const q = Q[i], v = ans[q.id], pct = Math.round(i / Q.length * 100);
      const LBL = ["", "سيئ", "مقبول", "جيد", "جيد جدًا", "ممتاز"];
      let body = "";
      if (q.kind === "rating") body = `<div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button class="star ${v >= n ? "on" : ""}" data-v="${n}" aria-label="${n} من 5">★</button>`).join("")}</div><div class="slabel">${v ? LBL[v] : "اختر من 1 إلى 5 نجوم"}</div>`;
      else if (q.kind === "text") body = `<textarea placeholder="اكتب هنا…" maxlength="1000">${esc(v || "")}</textarea>`;
      else body = `<div class="opts">${q.options.map((o, k) => `<button class="opt ${v === k ? "on" : ""}" data-v="${k}"><span class="dot"></span>${esc(o)}</button>`).join("")}</div>`;
      view(`<div class="prog"><i style="width:${pct}%"></i></div><div class="qn">السؤال ${i + 1} من ${Q.length}${q.required ? "" : " • اختياري"}</div><h2 class="q">${esc(q.text)}</h2>${body}
        <div class="err"></div><div class="nav"><button class="btn ghost" data-prev>${i ? "السابق" : "رجوع"}</button><button class="btn" data-next>${i === Q.length - 1 ? "إرسال" : "التالي"}</button></div>`);
      const next = () => {
        if (q.kind === "text") ans[q.id] = app.querySelector("textarea").value.trim();
        if (q.required && (ans[q.id] === undefined || ans[q.id] === "")) return app.querySelector(".err").textContent = "يرجى الإجابة عن هذا السؤال";
        ask(i + 1);
      };
      app.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => {
        ans[q.id] = +b.dataset.v;
        if (q.kind === "rating") { app.querySelectorAll(".star").forEach((s2) => s2.classList.toggle("on", +s2.dataset.v <= ans[q.id])); app.querySelector(".slabel").textContent = LBL[ans[q.id]]; }
        else app.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o === b));
        setTimeout(next, 280); // الانتقال تلقائيًا بعد الاختيار
      });
      app.querySelector("[data-next]").onclick = next;
      app.querySelector("[data-prev]").onclick = () => i ? ask(i - 1) : intro();
    };
    const submit = async () => {
      view(`<div class="spin"></div><p class="lead" style="text-align:center">جارٍ الإرسال…</p>`);
      try {
        await rpc("submit_survey", { p_survey: s.id, p_token: state.mosque.token, p_answers: Q.map((q) => ({ q: q.id, v: ans[q.id] ?? null })) });
        view(`<div class="done"><div class="ok">✓</div><h1>${esc(s.thanks || "شكرًا لك، وصلت إجابتك")}</h1><p class="lead">جزاك الله خيرًا على مساهمتك في العناية بـ${esc(state.mosque.name)}.</p>
          <div class="nav"><button class="btn ghost" data-c style="flex:1">لديك شكوى أو اقتراح؟</button></div></div>`);
        app.querySelector("[data-c]").onclick = complaintForm;
      } catch (e) { view(`<p class="err">${esc(e.message)}</p><div class="nav"><button class="btn" data-r>إعادة المحاولة</button></div>`); app.querySelector("[data-r]").onclick = submit; }
    };
    intro();
  }

  // ───── الشكوى أو الاقتراح ─────
  function complaintForm() {
    if (!state.mosque) return pickMosque(complaintForm);
    let kind = P.get("k") === "suggestion" ? "suggestion" : "complaint";
    view(`${mqCard()}<h1>شكوى أو اقتراح</h1><p class="lead">اكتب ملاحظتك وسنتعامل معها في أقرب وقت.</p>
      <div class="seg"><button data-k="complaint">شكوى</button><button data-k="suggestion">اقتراح</button></div>
      <label class="f">اشرح المشكلة أو الاقتراح <textarea name="body" maxlength="2000" placeholder="مثال: الرائحة ضعيفة في مصلى النساء…"></textarea></label>
      <label class="f">الاسم <small>(اختياري)</small><input name="name" maxlength="80" autocomplete="name"></label>
      <label class="f">رقم الجوال <small>(اختياري — للتواصل معك بخصوص ملاحظتك)</small><input name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right" autocomplete="tel"></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="err"></div><div class="nav">${P.get("do") === "complaint" ? "" : `<button class="btn ghost" data-back>رجوع</button>`}<button class="btn" data-send>إرسال</button></div>`);
    bindChange(complaintForm);
    const seg = () => app.querySelectorAll("[data-k]").forEach((b) => b.classList.toggle("on", b.dataset.k === kind));
    app.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => { kind = b.dataset.k; seg(); }); seg();
    app.querySelector("[data-back]")?.addEventListener("click", home);
    app.querySelector("[data-send]").onclick = async (e) => {
      const f = (n) => app.querySelector(`[name="${n}"]`).value.trim(), err = app.querySelector(".err");
      if (f("website")) return; // حقل مخفي يملؤه المتطفلون الآليون فقط
      if (f("body").length < 5) return err.textContent = "يرجى كتابة وصف أوضح (5 أحرف على الأقل)";
      e.target.setAttribute("disabled", ""); err.textContent = "";
      try {
        const ref = await rpc("submit_complaint", { p_token: state.mosque.token, p_kind: kind, p_name: f("name"), p_phone: f("phone"), p_body: f("body") });
        view(`<div class="done"><div class="ok">✓</div><h1>وصلت ${kind === "suggestion" ? "اقتراحك" : "شكواك"}، شكرًا لك</h1><p class="lead">سيتم التعامل معها${f("phone") ? " والتواصل معك عند الحاجة" : ""}.</p><span class="ref">رقم المتابعة: ${esc(ref)}</span></div>`);
      } catch (x) { err.textContent = x.message; e.target.removeAttribute("disabled"); }
    };
  }

  // ───── البداية حسب الرابط ─────
  (async () => {
    const tok = P.get("m");
    if (tok) {
      try { state.mosque = await rpc("public_mosque", { p_token: tok }); } catch {}
      if (!state.mosque) return view(`<h1>الرمز غير صحيح</h1><p class="lead">تأكد من مسح الباركود الموجود في المسجد.</p>`);
    }
    const d = P.get("do");
    if (d === "survey" || (!tok && (P.get("s") || !d))) return startSurvey();
    if (d === "complaint") return complaintForm();
    home();
  })();
})();
</script>
</body>
</html>
